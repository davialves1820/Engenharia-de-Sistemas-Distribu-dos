# sonar-project.properties
# Config do SonarCloud/SonarQube para o GoFood.
sonar.projectKey=gofood
sonar.organization=sua-org
sonar.projectName=GoFood

# Fontes analisadas
sonar.sources=backend,frontend
sonar.sourceEncoding=UTF-8

# Exclusoes (nao analisar dependencias/build)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js

# Cobertura de testes (se houver)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Quality Gate: falha o PR se novos bugs/vulnerabilidades forem introduzidos
# (configurado no lado do SonarCloud, mas referenciado aqui)
sonar.qualitygate.wait=true
